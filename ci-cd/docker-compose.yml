name: serverless-backend
services:
  app-serverless-backend:
    image: app-serverless-backend:local
    container_name: app-serverless-backend
    restart: always
    env_file:
      - .env_app
    networks:
      - custom-network
  
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: always
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml
      - ./acme.json:/etc/traefik/acme.json
    networks: 
      - custom-network

networks:
  custom-network:
    name: custom-network
