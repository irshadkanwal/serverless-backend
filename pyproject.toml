[project]
name = "serverless-backend"
version = "0.1.0"
description = "CoachBot serverless backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "fastapi[standard]",
    "lightrag-hku @ git+https://github.com/OxidBurn/LightRAG@main-coachbot",
    "setuptools",
    "asyncpg",
    "psycopg2-binary",
    "uvicorn",
    "pydantic",
    "openai",
    "asyncio==4.0.0",
    "aiohttp==3.12.15",
    "backoff",
    "pydantic_settings",
    "mem0ai @ git+https://github.com/mem0ai/mem0@main",
    "neo4j",
    "langchain-neo4j",
    "slowapi",
    "azure-identity>=1.25.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.ruff]
    line-length = 88
    indent-width = 4
    target-version = "py312"

    extend-exclude = ["app/prompts"]

[tool.ruff.lint]
    extend-select = [
        "F",        # Pyflakes rules
        "W",        # PyCodeStyle warnings
        "E",        # PyCodeStyle errors
        "I",        # Sort imports properly
        "UP",       # Warn if certain things can changed due to newer Python versions
        "C4",       # Catch incorrect use of comprehensions, dict, list, etc
        "FA",       # Enforce from __future__ import annotations
        "ISC",      # Good use of string concatenation
        "ICN",      # Use common import conventions
        "RET",      # Good return practices
        "SIM",      # Common simplification rules
        "TID",      # Some good import practices
        "PTH",      # Use pathlib instead of os.path
        "NPY",      # Check code against PEP 8 naming conventions
        "PERF",     # Performance-related rules
        "ARG",      # Argument-related rules
    ]
    ignore = []
    fixable = ["ALL"]
    unfixable = []
    dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.rules]
